
name: Registration Form CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registration-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f registration.html
          test -f registration.css
          test -f registration.js
          echo "All registration form files exist!"

      - name: Validate basic HTML structure
        run: |
          grep -qi '<html' registration.html
          grep -qi '</html>' registration.html
          echo "HTML structure check passed!"

  deploy:
    needs: registration-check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare website files
        run: |
          mkdir -p _site
          cp registration.html _site/index.html
          cp registration.css _site/
          cp registration.js _site/

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
